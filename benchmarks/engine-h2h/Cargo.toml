[package]
name = "golsm-engine-h2h"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[dependencies]
kiban = { path = "build/kiban" }
heed3 = "=0.22.0"
lmdb-master3-sys = "=0.2.5"
mimalloc = "=0.1.48"
libmimalloc-sys = "=0.1.44"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.143"

[profile.release]
opt-level = 2
codegen-units = 1
lto = true
panic = "abort"
debug = 1
